name: D1 Schema Drift Check

# Nightly guard: the prod D1 schema must match what's committed under
# api/bootstrap-schema.sql + api/schema-v*.sql.  Drift indicates someone ran a
# migration against prod without landing the corresponding schema file
# (or vice versa) — the exact failure mode that caused the 2026-04-14
# R10 cross-repo cascade.
#
# On drift: the job fails and GitHub surfaces the diff in the Action log.
# A human must reconcile before the next deploy.
#
# SECRETS REQUIRED (configured once by a repo admin in
# Settings -> Secrets and variables -> Actions):
#
#   CLOUDFLARE_API_TOKEN
#     Cloudflare API token with the "D1:Read" permission on the
#     mn-ccore-lab account.  Do NOT reuse the Pages deploy token —
#     that one is scoped to Pages only and will 7403 on any d1
#     execute call.  Create a fresh token at
#     https://dash.cloudflare.com/profile/api-tokens with template
#     "Read D1" and scope it to the single mnccore-lab database.
#
#   CLOUDFLARE_ACCOUNT_ID
#     Cloudflare account id that owns the mnccore-lab D1.  Found at
#     https://dash.cloudflare.com/<account-id> in the URL.
#
# THIS WORKFLOW IS THE ONLY PLACE IN THE REPO THAT RUNS
# `wrangler d1 execute --remote`.  All other local/test paths use
# `--local` against Miniflare.

on:
  schedule:
    - cron: '0 9 * * *'    # 09:00 UTC daily (~3am CT)
  workflow_dispatch: {}     # allow manual trigger

jobs:
  schema-drift:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          # pb-schema is a PRIVATE git submodule (ingra107/pb-schema) holding the
          # generated TABLE_FIELDS SSOT that the schema-contract lint imports
          # (F1, 2026-06-02). The default GITHUB_TOKEN is scoped to this repo only
          # and cannot read the sibling private repo, so submodule checkout needs a
          # PAT with Contents:Read on BOTH ingra107/mn-ccore-lab and ingra107/pb-schema.
          #
          # SECRET REQUIRED (repo admin, Settings -> Secrets and variables -> Actions):
          #   PB_SCHEMA_PAT — fine-grained PAT, Contents: Read-only, scoped to
          #   ingra107/mn-ccore-lab + ingra107/pb-schema.
          submodules: recursive
          token: ${{ secrets.PB_SCHEMA_PAT }}

      - name: pb-schema contract manifest verify (fail-closed)
        # Slice 6 (PB 2026-06-08): the pb-schema submodule is a versioned contract
        # bundle (committed generated/* + manifest.json). PB (schema_dsl_codegen)
        # is the sole emitter. This renderer-free, PB-free hash check asserts the
        # committed artifacts the Worker bundles (field-authority.generated.ts,
        # enum-domains.generated.json) match their manifest SHA-256 — the Hub-side
        # always-present integrity backstop that closes the SKIP-LOUD gap on this
        # repo too. NO continue-on-error: exit 1 fails the job. Pure stdlib Python;
        # no wrangler, no D1, no secrets.
        run: python3 -m pb_schema.verify
        working-directory: pb-schema

      - name: Schema version integrity (INFRA-5)
        # Fast pre-flight using stdlib Python — no Node/wrangler required.
        # Checks three structural properties of the api/schema-v*.sql file set:
        #   1. Ordered-version list: any NEW gap vs the committed snapshot fails.
        #   2. Duplicate-prefix detection: any NEW file sharing an existing vNN fails.
        #   3. Snapshot hash: SHA-256 of sorted filenames must match
        #      scripts/schema-version-snapshot.json.
        #
        # The snapshot is the authoritative baseline.  When a schema file is
        # intentionally added or removed the developer must run:
        #   python scripts/check-schema-versions.py --update
        # and commit the updated snapshot alongside the schema file change.
        #
        # Runs on Python 3.x (stdlib only).  Ubuntu default Python 3 is used.
        run: python3 scripts/check-schema-versions.py

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Install wrangler
        run: npm install -g wrangler@^4.14.0

      - name: Write SQL normalizer
        # Both prod (via sqlite_master) and committed (via files) need the
        # same canonical form before diff. Without this, multi-line CREATE
        # in schema.sql vs single-line in sqlite_master produces phantom
        # drift on every comparison.
        run: |
          cat > normalize-sql.cjs <<'EOF'
          // normalizeSql(rawSqlText) -> sorted canonical statements joined by '\n'
          //   - splits into statements with a SINGLE quote-aware lexer pass
          //   - collapses ALL whitespace runs to single space
          //   - strips paren-adjacent whitespace
          //   - removes "IF NOT EXISTS"
          //   - drops sqlite_* / _cf_KV / d1_migrations internal tables
          //   - SORTS CREATE TABLE columns alphabetically so positional
          //     differences (e.g. prod has col X at end via ALTER but
          //     committed schema has it inline) don't show up as drift.
          //     Real structural differences (different defaults, NOT NULL
          //     constraints, different PKs) still surface.
          //   - sorts statements case-insensitively for stable diff
          //
          // WHY A LEXER AND NOT REGEXES (2026-07-30, the 8-night RED):
          // The previous version ran three INDEPENDENT regex passes -- strip /* */,
          // strip --, then split(';') -- and their composition was the bug. A `--`
          // inside a string literal is not a comment, but the stripper could not tell:
          //   CREATE TRIGGER ... BEGIN SELECT RAISE(ABORT, 'x -- do y'); END
          // The `-- do y'); END` was eaten to end-of-line, taking the closing quote
          // AND the `;` terminator with it, so the NEXT statement was glued onto this
          // one. 11 of prod's 315 statements carry `--` inside a message string; the
          // resulting merges land in different places on the prod side (ordered by
          // type,name) than the committed side (file order), so the two canonical
          // forms disagreed and `Diff prod vs committed` failed every night from
          // 2026-07-22 with no real drift behind it.
          // Making the tokenizer aware of what a string literal IS removes the whole
          // class -- `--`, `/* */` and `;` simply cannot be seen as syntax inside a
          // quoted region, so there is no case left to special-case.
          //
          // The same pass also tracks BEGIN/CASE...END so a trigger body's internal
          // `;` no longer chops the trigger into fragments. That chopping was lossy
          // but SYMMETRIC (both sides did it identically), so it never by itself
          // caused a diff -- it just left 33 bare `END` statements in the canonical
          // form and made the artifact unreadable for whoever came to diagnose it.
          function splitStatements(text) {
            const stmts = []
            let buf = ''
            let i = 0
            const n = text.length
            let blockDepth = 0
            let inTrigger = false

            const flush = () => {
              const s = buf.trim()
              if (s.length) stmts.push(s)
              buf = ''
              blockDepth = 0
              inTrigger = false
            }

            while (i < n) {
              const ch = text[i]
              const nx = text[i + 1]

              // line comment -- only OUTSIDE a quoted region, which is the whole point
              if (ch === '-' && nx === '-') {
                while (i < n && text[i] !== '\n') i++
                buf += ' '
                continue
              }
              if (ch === '/' && nx === '*') {
                i += 2
                while (i < n && !(text[i] === '*' && text[i + 1] === '/')) i++
                i += 2
                buf += ' '
                continue
              }
              // string literal / quoted identifier; SQL escapes the quote by doubling it
              if (ch === "'" || ch === '"' || ch === '`') {
                const q = ch
                buf += q
                i++
                while (i < n) {
                  if (text[i] === q && text[i + 1] === q) { buf += q + q; i += 2; continue }
                  if (text[i] === q) { buf += q; i++; break }
                  buf += text[i]; i++
                }
                continue
              }
              if (ch === '[') {
                buf += ch; i++
                while (i < n && text[i] !== ']') { buf += text[i]; i++ }
                if (i < n) { buf += ']'; i++ }
                continue
              }
              // words: track CREATE TRIGGER, then BEGIN/CASE ... END nesting
              if (/[A-Za-z_]/.test(ch)) {
                let j = i
                while (j < n && /[A-Za-z0-9_]/.test(text[j])) j++
                const word = text.slice(i, j)
                const up = word.toUpperCase()
                if (up === 'TRIGGER' && /\bCREATE\s+(?:TEMP\s+|TEMPORARY\s+)?$/i.test(buf)) inTrigger = true
                if (inTrigger) {
                  if (up === 'BEGIN' || up === 'CASE') blockDepth++
                  else if (up === 'END' && blockDepth > 0) blockDepth--
                }
                buf += word
                i = j
                continue
              }
              if (ch === ';' && blockDepth === 0) { flush(); i++; continue }
              buf += ch
              i++
            }
            flush()
            return stmts
          }

          function sortTableColumns(stmt) {
            const m = stmt.match(/^(CREATE TABLE\s+(?:"[^"]+"|\w+)\s*)\((.*)\)\s*$/i)
            if (!m) return stmt
            const prefix = m[1]
            const body = m[2]
            const parts = []
            let depth = 0
            let buf = ''
            for (const ch of body) {
              if (ch === '(') depth++
              else if (ch === ')') depth--
              if (ch === ',' && depth === 0) {
                parts.push(buf.trim())
                buf = ''
              } else {
                buf += ch
              }
            }
            if (buf.trim()) parts.push(buf.trim())
            parts.sort((a, b) => a.localeCompare(b, 'en', { sensitivity: 'base' }))
            return prefix + '(' + parts.join(', ') + ')'
          }

          function normalizeSql(text) {
            const stmts = splitStatements(text)
              .map(s => s.replace(/\s+/g, ' ').trim())
              .map(s => s.replace(/\bIF NOT EXISTS\b/gi, '').replace(/\s+/g, ' ').trim())
              .map(s => s.replace(/\(\s+/g, '(').replace(/\s+\)/g, ')').replace(/\s+,/g, ',').replace(/,\s+/g, ', '))
              .map(s => s.replace(/\s+/g, ' ').trim())
              .map(s => /^CREATE TABLE\b/i.test(s) ? sortTableColumns(s) : s)
              .filter(s => s.length > 0)
              .filter(s => !/^CREATE TABLE\s+sqlite_sequence\b/i.test(s))
              .filter(s => !/^CREATE TABLE\s+_cf_KV\b/i.test(s))
              .filter(s => !/^CREATE TABLE\s+d1_migrations\b/i.test(s))
            return stmts.sort((a, b) => a.localeCompare(b, 'en', { sensitivity: 'base' })).join('\n')
          }

          module.exports = { normalizeSql }
          EOF

      - name: Dump prod D1 schema
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # `.schema` is a sqlite3 CLI dot-command — D1's HTTP API rejects
          # with SQLITE_ERROR 7500. Query sqlite_master directly.
          wrangler d1 execute mnccore-lab \
            --remote \
            --command "SELECT sql FROM sqlite_master WHERE type IN ('table','index','trigger','view') AND sql IS NOT NULL ORDER BY type, name" \
            --json > prod-schema.json
          node -e "
            const { normalizeSql } = require('./normalize-sql.cjs');
            const j = require('./prod-schema.json');
            const rows = (j[0] && j[0].results) || [];
            const raw = rows.map(r => r.sql || Object.values(r)[0]).filter(Boolean).join(';\n') + ';';
            require('fs').writeFileSync('prod-schema.sql', normalizeSql(raw) + '\n');
          "

      - name: "Migration ledger vs committed file list (backlog #893)"
        # schema_migrations (introduced by schema-v105-schema-migrations-
        # ledger.sql) records which schema-vNN*.sql files at/after v105
        # actually ran to completion on prod, via a self-registering INSERT
        # that check-schema-versions.py's assertion-4 requires on the source
        # side. This step is the CI-side half: a committed v105+ file with NO
        # matching ledger row means it was never applied, or was applied and
        # failed before its self-registering INSERT ran — exactly the gap
        # that made #564 and #559 answerable only by ad-hoc row-counting.
        #
        # Soft-skips (informational, exit 0) until schema-v105 itself has
        # been applied to prod: the table not existing yet is the EXPECTED
        # state between "source merged" and "DDL applied" (a separate,
        # explicitly authorized step — see backlog #893's scope-question).
        # Once the table exists, a committed v105+ file with no matching row
        # hard-fails BY NAME.
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          wrangler d1 execute mnccore-lab \
            --remote \
            --command "SELECT filename FROM schema_migrations" \
            --json > ledger.json 2> ledger-stderr.log || true

          # Search BOTH streams. `wrangler d1 execute --json` writes its error
          # payload to STDOUT, not stderr (measured 2026-07-30: 409 bytes on
          # stdout, 0 on stderr) — so a stderr-only grep never sees "no such
          # table", ledger.json is non-empty, and the step hard-fails every
          # committed v105+ file during exactly the window this soft-skip
          # exists for. Same trap documented in Peripheral-Brain's
          # scripts/wrangler_d1.py.
          if grep -qi "no such table" ledger.json ledger-stderr.log; then
            echo "INFO: schema_migrations does not exist on prod yet (schema-v105 not applied). Skipping ledger-vs-committed check until it is."
            exit 0
          fi

          if [ ! -s ledger.json ]; then
            echo "::warning::Migration ledger query produced no output and did not report 'no such table' — treating as a transient failure, not drift."
            cat ledger-stderr.log || true
            exit 0
          fi

          node -e "
            const fs = require('fs');
            const LEDGER_EPOCH_VERSION = 105;
            const j = JSON.parse(fs.readFileSync('ledger.json', 'utf8'));

            // A successful --json run returns an ARRAY of result objects. Any
            // other shape is an error payload or a format change, NOT 'the
            // ledger is empty' — and treating it as empty would report every
            // committed file as never-applied. Say so and skip; a wrong drift
            // claim is worse than no claim.
            if (!Array.isArray(j) || !j[0] || !Array.isArray(j[0].results)) {
              console.log('::warning::Migration ledger query returned a non-array payload (error or changed --json format), not a result set. Skipping rather than reporting false drift. Payload head: ' + JSON.stringify(j).slice(0, 300));
              process.exit(0);
            }
            const registered = new Set(j[0].results.map(r => r.filename));

            const committed = fs.readdirSync('api')
              .map(f => { const m = f.match(/^schema-v(\d+)(?:-([^.]+))?\.sql\$/); return m ? { file: f, version: +m[1] } : null; })
              .filter(Boolean)
              .filter(x => x.version >= LEDGER_EPOCH_VERSION)
              .map(x => x.file);

            const missing = committed.filter(f => !registered.has(f));
            if (missing.length > 0) {
              console.error('::error::Committed schema file(s) at/after v' + LEDGER_EPOCH_VERSION + ' with NO matching schema_migrations row on prod (never applied, or applied and failed before the self-registering INSERT):');
              missing.forEach(f => console.error('  - ' + f));
              process.exit(1);
            }
            console.log('Migration ledger OK: ' + committed.length + ' committed file(s) at/after v' + LEDGER_EPOCH_VERSION + ', all registered on prod.');
          "

      - name: Build committed schema reference
        run: |
          # Reality check (audit found 2026-04-21): api/bootstrap-schema.sql only has
          # ~7 tables. The other ~43 tables + every index live in migration
          # files (api/schema-v*.sql). Migrations were never designed to
          # replay against each other — some add a column that bootstrap-schema.sql
          # also declares. So we apply bootstrap-schema.sql + every migration in
          # version order, but *tolerate* duplicate-column / table-exists
          # errors (expected overlap). Real SQL syntax errors would show
          # up as missing tables in the final diff.
          rm -f committed.db
          node -e "
            const fs = require('fs'); const path = require('path');
            const dir = 'api';
            const base = fs.readFileSync(path.join(dir, 'bootstrap-schema.sql'), 'utf8');
            const migFiles = fs.readdirSync(dir)
              .map(f => { const m = f.match(/^schema-v(\d+)(?:-([^.]+))?\.sql\$/); return m ? { file: f, version: +m[1], variant: m[2] ? 1 : 0 } : null })
              .filter(Boolean)
              .sort((a, b) => a.version - b.version || a.variant - b.variant);
            const parts = [base, ...migFiles.map(x => fs.readFileSync(path.join(dir, x.file), 'utf8'))];
            fs.writeFileSync('committed-bundle.sql', parts.join('\n') + '\n');
          "
          # Apply with -bail off (default); redirect errors we expect to
          # see (duplicate column, table already exists) — keep other
          # errors visible. Suppress exit code: the meaningful check is
          # whether the resulting schema matches prod, not whether every
          # historical migration replayed cleanly against current base.
          sqlite3 committed.db < committed-bundle.sql 2> sqlite-errors.log || true
          # Show only unexpected errors (not the known overlap cases).
          #
          # Known expected replay errors (schema-history artifacts, not real drift):
          #   "no such column: title|body"       — schema-v22 INSERT…SELECT from lab_questions/
          #                                         lab_answers uses the OLD column names (title,
          #                                         body) that v22 itself renames; bootstrap already
          #                                         has the renamed schema so these columns are gone
          #                                         by replay time.  Final diff still validates
          #                                         the resulting table shape.
          #   "no such column: machine_id|       — schema-v48 CREATE INDEX ON pomodoro_sessions
          #    project_id"                          references machine_id/project_id, but at replay
          #                                         time pomodoro_sessions still has the v20 schema
          #                                         (no those columns) because v48's CREATE TABLE IF
          #                                         NOT EXISTS silently no-ops.  v49 later recreates
          #                                         the table with the correct schema; the indices
          #                                         there succeed.  Final diff validates the result.
          #   "no such table: main.comments"     — schema-v46 adds an index on a `comments` table
          #                                         that was never promoted to the committed schema
          #                                         (the live comments surface uses task_comments).
          #                                         The index is therefore never created; no drift.
          #
          # If a NEW unexpected error appears (e.g. "no such column: foo" for some other column
          # name, or a genuine syntax error), it will NOT match these patterns and WILL surface
          # as a warning — keeping the signal sharp.
          KNOWN_ERRORS="duplicate column name|table [a-z_]+ already exists|index [a-z_]+ already exists"
          KNOWN_ERRORS="${KNOWN_ERRORS}|no such column: title|no such column: body"
          KNOWN_ERRORS="${KNOWN_ERRORS}|no such column: machine_id|no such column: project_id"
          KNOWN_ERRORS="${KNOWN_ERRORS}|no such table: main.comments"
          if grep -v -E "${KNOWN_ERRORS}" sqlite-errors.log | grep -qi "error"; then
            echo "::warning::Unexpected sqlite errors during committed schema build (see log below)"
            grep -v -E "${KNOWN_ERRORS}" sqlite-errors.log | head -20 || true
          fi
          sqlite3 committed.db .schema > committed-raw.sql
          node -e "
            const { normalizeSql } = require('./normalize-sql.cjs');
            const raw = require('fs').readFileSync('committed-raw.sql', 'utf8');
            require('fs').writeFileSync('committed-schema.sql', normalizeSql(raw) + '\n');
          "

      - name: Diff prod vs committed
        run: |
          # Both sides are now canonical — true line-by-line diff.
          if ! diff -u committed-schema.sql prod-schema.sql > schema-drift.diff; then
            echo "::error::D1 schema drift detected — prod diverges from committed api/schema*.sql"
            echo "--- committed-schema.sql vs prod-schema.sql ---"
            cat schema-drift.diff
            exit 1
          fi
          echo "Schema in sync."

      - name: Upload drift artifact
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: schema-drift-diff
          path: |
            committed-schema.sql
            prod-schema.sql
            schema-drift.diff
          retention-days: 30

      - name: Install npm dependencies (for contract lint)
        run: npm ci

      - name: Schema contract lint (codex Q6+Q9)
        # Compares TABLE_FIELDS, route ALLOWED_FIELDS, and SQL column refs
        # against the committed D1 schema files. Catches phantom column bugs
        # like the deleted tasks.recurrence branch (Task 1.6, PB SHA b06ce2b3).
        # Exit 1 if any gap found; gaps listed in job log.
        run: npm run audit:schema-contract

      - name: Project-identity completeness gate (Slice E, fail-closed)
        # Symmetric Project-Identity Convergence gate — the Hub D1 half. Asserts
        # ONE machine identity = typed proj_* PK across every identity-bearing
        # project surface on prod D1 (storage, FK columns, kg composite keys),
        # FAIL-CLOSED: an UNKNOWN %project%id% column not in the committed SSOT
        # (scripts/project-identity-surfaces.json) red-fails the job. Also runs
        # Slice-A verify assertions a-d + today's-lessons L1/L2 (kg-node vs
        # projects-table; tombstone valid_until co-set). Stdlib Python; reuses
        # the same D1-scoped CLOUDFLARE_API_TOKEN this workflow already uses.
        # Decision: PB Context/Decisions/2026-06-05-project-identity-single-machine-identity.md
        # Canonical both-store gate: PB scripts/db/project_identity_gate.py.
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: python3 scripts/check-project-identity-gate.py

      - name: Time-discipline lint (Increment 1A R20/R21, ENFORCE)
        # Hub-local stdlib mirror — does NOT depend on a PB checkout. ENFORCE
        # mode (hard-fail) since the Plan 1B display-site migration cleared the
        # backlog to zero (2026-05-25): all date sites use canonical helpers
        # (src/lib/time.ts, src/lib/dateUtils.ts, api/lib/time.ts, ct-date.ts).
        #
        # No `|| true`: in ENFORCE mode the script exits 1 on any R20/R21 hit,
        # red-failing the build so a regression is caught at PR time.
        env:
          TIME_LINT_MODE: enforce
        run: node scripts/check-time-discipline.mjs
