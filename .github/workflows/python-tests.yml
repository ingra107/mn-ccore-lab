name: Python script tests

# WHY THIS EXISTS (PB backlog #2290, 2026-09-24).
#
# The repo's Python tooling carries its own pytest tests --
# scripts/test_check_project_identity_gate.py (#2231: the identity gate's
# wrangler error payload is on STDOUT) and
# scripts/test_wrangler_d1_cold_token_retry.py (#1293: the cold-OAuth retry) --
# and no workflow ran pytest at all, so they ran only when a developer
# remembered to. An unrun test is a claim nobody checks.
#
# Collection is by pytest's own convention (every scripts/**/test_*.py), not a
# list here, so a new script test is covered the day it lands. The tests are
# stdlib + pytest and monkeypatch every subprocess: no wrangler, no D1, no
# secrets, no npm.

on:
  pull_request:
    paths:
      - 'scripts/**/*.py'
      - '.github/workflows/python-tests.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/**/*.py'
      - '.github/workflows/python-tests.yml'
  workflow_dispatch: {}

concurrency:
  group: python-tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install pytest
        run: python -m pip install pytest

      - name: pytest scripts/
        # Exit 5 = "no tests collected": a collection that silently finds
        # nothing must fail, not pass, so it is NOT tolerated here.
        run: python -m pytest scripts -q
