name: Vitest Gate (api + lib + src)

# WHY THIS EXISTS (backlog #505, 2026-07-16).
#
# Before this workflow, NOTHING in CI ran any vitest suite. `npm run test:api`
# (1129+ tests) only ran manually; the two configs covering src/ logic
# (vitest.config.lib.ts — node-mode pure-logic; vitest.config.ts — browser-mode
# component tests) had no npm script at all, so a src/ logic change could ship
# with a written-but-never-executed test. #546 is the concrete cost class: a
# ?raw=1-vs-/raw router seam shipped through a fully green api suite because
# nothing exercised the real router wiring — the suite was never gated in the
# first place, so "green" only meant "green when a human remembered to run it."
#
# This workflow runs all three vitest configs (api/lib/src) on every PR that
# touches api/, src/, a vitest config, or package.json — the same scope as the
# local pre-commit gate (.githooks/pre-commit), so a contributor without the
# hook installed still gets the gate on the PR.

on:
  pull_request:
    paths:
      - 'api/**'
      - 'src/**'
      - 'vitest.config*.ts'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/vitest.yml'
  push:
    branches: [main]
    paths:
      - 'api/**'
      - 'src/**'
      - 'vitest.config*.ts'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/vitest.yml'
  workflow_dispatch: {}

concurrency:
  group: vitest-gate-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  vitest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          # pb-schema is a PRIVATE git submodule — api/index.ts and
          # api/routes/projects.ts import generated field-authority artifacts
          # from it (F1, 2026-06-02). Same PAT + submodule shape as
          # schema-drift.yml (repo admin: Settings -> Secrets and variables ->
          # Actions -> PB_SCHEMA_PAT, Contents:Read on both repos).
          submodules: recursive
          token: ${{ secrets.PB_SCHEMA_PAT }}

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright chromium (vitest.config.ts browser mode)
        run: npx playwright install --with-deps chromium

      - name: api (Worker routes, node mode)
        # !cancelled() (not the default sequential skip): the three suites
        # below are mutually independent — none consumes another's output,
        # and this one needs neither Playwright nor the other two suites'
        # results. Without this, a red test:api reports test:lib/test:src as
        # `skipped`, and a red Playwright install reports ALL THREE as
        # `skipped` even though test:api/test:lib never touch a browser —
        # same masking class as schema-drift.yml (backlog #1041, #1094).
        if: ${{ !cancelled() }}
        run: npm run test:api

      - name: lib (src/lib pure-logic, node mode)
        if: ${{ !cancelled() }}
        run: npm run test:lib

      - name: src (components, browser mode via chromium)
        if: ${{ !cancelled() }}
        run: npm run test:src
