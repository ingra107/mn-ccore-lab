<svg width="1200" height="630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f1923"/>
      <stop offset="40%" stop-color="#1a2a3a"/>
      <stop offset="100%" stop-color="#2c3e50"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Gold accent line at top -->
  <rect x="0" y="0" width="1200" height="3" fill="#c9a84c" opacity="0.8"/>

  <!-- Logo text -->
  <text x="600" y="220" text-anchor="middle" font-family="Georgia, serif" font-size="72" font-weight="800" fill="#faf8f3" letter-spacing="4">
    MN<tspan fill="#c9a84c">&#x2764;</tspan>CCORE
  </text>

  <!-- Subtitle -->
  <text x="600" y="280" text-anchor="middle" font-family="Georgia, serif" font-size="18" fill="#c9a84c" letter-spacing="6" text-transform="uppercase" opacity="0.8">
    MINNESOTA CRITICAL CARE OUTCOMES &amp; RESEARCH EFFORT
  </text>

  <!-- Tagline -->
  <text x="600" y="340" text-anchor="middle" font-family="sans-serif" font-size="24" fill="rgba(250,248,243,0.7)" font-style="italic">
    Advancing Critical Care Through Data-Driven Discovery
  </text>

  <!-- Stats bar -->
  <text x="600" y="420" text-anchor="middle" font-family="monospace" font-size="16" fill="rgba(250,248,243,0.5)" letter-spacing="2">
    13+ CENTERS  &#x00B7;  60+ PUBLICATIONS  &#x00B7;  CLIF CONSORTIUM
  </text>

  <!-- University -->
  <text x="600" y="530" text-anchor="middle" font-family="monospace" font-size="14" fill="rgba(201,168,76,0.6)" letter-spacing="4" text-transform="uppercase">
    UNIVERSITY OF MINNESOTA
  </text>

  <!-- Gold accent line at bottom -->
  <rect x="0" y="627" width="1200" height="3" fill="#c9a84c" opacity="0.8"/>
</svg>
