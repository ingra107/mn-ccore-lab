<!doctype html>
<html><head>
<meta charset="utf-8"/>
<title>MN-CCORE Hub · UI Kit</title>
<link rel="stylesheet" href="../colors_and_type.css"/>
<style>
  html,body{margin:0;height:100%;background:#0b1017;color:#e2e8f0;font-family:'DM Sans',sans-serif}
  #root{height:100vh;display:flex;flex-direction:column}
  *{box-sizing:border-box}
  ::-webkit-scrollbar{width:10px;height:10px}
  ::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.08);border-radius:4px}
  ::-webkit-scrollbar-thumb:hover{background:rgba(255,255,255,0.14)}
</style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel" src="shared.jsx"></script>
<script type="text/babel" src="Shell.jsx"></script>
<script type="text/babel" src="Dashboard.jsx"></script>
<script type="text/babel" src="Tasks.jsx"></script>
<script type="text/babel" src="Projects.jsx"></script>
<script type="text/babel" src="Meetings.jsx"></script>
<script type="text/babel" src="Hermes.jsx"></script>
<script type="text/babel" data-presets="react">
const { useState: useStateApp } = React;
const TITLES = {
  dashboard:{t:'Dashboard', b:['Hub']},
  mine:{t:'My items', b:['Hub']},
  tasks:{t:'Tasks', b:['Hub']},
  meetings:{t:'Meetings', b:['Hub']},
  projects:{t:'Projects', b:['Hub','Research']},
  grants:{t:'Grants', b:['Hub','Research']},
  digest:{t:'Research digest', b:['Hub','Research']},
  hermes:{t:'Hermes', b:['Hub','Research']},
  team:{t:'Team', b:['Hub','Lab']},
};
const App = () => {
  const [page,setPage] = useStateApp('dashboard');
  const page_ = TITLES[page] || TITLES.dashboard;
  const screen = {
    dashboard: <Dashboard/>,
    tasks: <Tasks/>,
    projects: <Projects/>,
    meetings: <Meetings/>,
    hermes: <Hermes/>,
  }[page] || (
    <div style={{padding:48,color:'#b0b5b9'}}>
      <div style={{fontSize:10,fontWeight:500,letterSpacing:'0.08em',textTransform:'uppercase',color:'#b0b5b9',marginBottom:8}}>{page}</div>
      <h2 style={{color:'#fff'}}>Coming soon</h2>
      <p>This surface is scaffolded in the Hub repo but not yet mocked in this UI kit.</p>
    </div>
  );
  return (
    <div data-screen-label={page} style={{display:'flex',height:'100%'}}>
      <SideBar current={page} onNav={setPage}/>
      <div style={{flex:1,display:'flex',flexDirection:'column',overflow:'hidden'}}>
        <TopBar title={page_.t} breadcrumbs={page_.b}
          actions={<>
            <Button variant="ghost" size="sm"><IconSearch size={13}/>Search</Button>
            <Button variant="primary" size="sm"><IconPlus size={13}/>Quick add</Button>
          </>}/>
        <div style={{flex:1,overflow:'hidden'}}>{screen}</div>
      </div>
    </div>
  );
};
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body></html>
