- generic [ref=e2]: "{\"data\":[{\"id\":\"recI2Q9r6oV6wmUBt\",\"meeting_id\":null,\"project_id\":\"cqode-backbone-umn-clif\",\"title\":\"Update CQODE for CLIF v3.0.0: new input table replaces intake_output\",\"description\":\"## CLIF v3.0.0 Changes Affecting CQODE (March 5, 2026)\\n\\n### 1. NEW TABLE: `input` (replaces intake side of `intake_output`)\\n**Columns:** hospitalization_id, recorded_dttm, input_name, input_category, input_group, input_volume (mL)\\n\\n**input_group values:** iv_fluids, blood_products, nutrition, medication_fluids, renal_replacement_fluids, flush_irrigation, other_intake\\n\\n**input_category values (16):**\\n- iv_crystalloid, iv_colloid -> iv_fluids\\n- blood_products -> blood_products\\n- parenteral_nutrition, po_intake, enteral_nutrition, enteral_water -> nutrition\\n- iv_medication, enteral_medication -> medication_fluids\\n- renal_replacement_fluids -> renal_replacement_fluids\\n- flush_irrigation_urine, flush_irrigation_drain, flush_irrigation_gi, flush_irrigation_respiratory, flush_irrigation_other -> flush_irrigation\\n- other_input -> other_intake\\n\\n### 2. NEW TABLE: `output` (replaces output side of `intake_output`)\\n**Columns:** hospitalization_id, recorded_dttm, output_name, output_category, output_group, output_volume (mL)\\n**output_group values:** urine, ultrafiltration, drains, gi, procedure, blood_loss, respiratory, other\\n\\n### 3. REMOVED: `intake_output` table (split into input + output)\\n\\n### 4. Other v3.0.0 changes\\n- **labs:** new `loinc_version` column\\n- **medication_admin_continuous:** new `infusion_rate` + `infusion_rate_units` columns\\n- **respiratory_support:** new device_category value \\\"T Piece\\\"\\n- **NEW TABLES (not in CQODE scope):** intermittent_dialysis, validated_diagnosis, clinical_notes_facts, clinical_notes_text\\n\\n### Links\\n- GitHub: https://github.com/Common-Longitudinal-ICU-data-Format/CLIF/issues/179\\n- Change log: https://clif-icu.com/data-dictionary/change-log\\n- v3.0.0 data dictionary: https://clif-icu.com/data-dictionary/data-dictionary-3.0.0\\n- mCIDE (3.0 branch): https://github.com/Common-Longitudinal-ICU-data-Format/CLIF/tree/3.0/mCIDE/input\\n\\n### CQODE Action Items\\n- [ ] Create `input` table mapping from EHR flowsheet data\\n- [ ] Create `output` table mapping from EHR flowsheet data \\n- [ ] Remove or deprecate `intake_output` ETL\\n- [ ] Add `loinc_version` to labs ETL\\n- [ ] Add `infusion_rate` + `infusion_rate_units` to medication_admin_continuous ETL\\n- [ ] Add \\\"T Piece\\\" to respiratory_support device_category mapping\\n\",\"assignee\":\"nick\",\"assigned_by\":null,\"due_date\":\"2026-03-14\",\"priority\":\"low\",\"status\":\"todo\",\"source\":\"sync\",\"completed\":0,\"completed_at\":null,\"completed_by\":null,\"created_at\":null,\"blocked_by\":null,\"updated_at\":\"2026-04-08 20:21:36\",\"deleted_at\":null,\"acknowledged_at\":null,\"acknowledged_by\":null,\"watchers\":null,\"reminder_days\":null,\"instructions\":null,\"description_json\":null,\"meeting_title\":null,\"meeting_date\":null},{\"id\":\"recev0eY8TTmAEm5q\",\"meeting_id\":null,\"project_id\":\"cqode-backbone-umn-clif\",\"title\":\"CQODE: Review mCIDE update (CLIF v3.0)\",\"description\":\"## mCIDE Update — CLIF v3.0\\n*Detected: 2026-03-07 02:15*\\n\\n- GitHub Issue: https://github.com/Common-Longitudinal-ICU-data-Format/CLIF/issues/179\\n\\n### Schema Details\\nCould not fetch mCIDE directory from GitHub.\\n\\n### Links\\n- [mCIDE Directory](https://github.com/Common-Longitudinal-ICU-data-Format/CLIF/tree/main/mCIDE)\\n- [CLIF Data Dictionary](https://clif-consortium.github.io/website/data-dictionary.html)\\n- [Branch 3.0](https://github.com/Common-Longitudinal-ICU-data-Format/CLIF/tree/3.0)\\n\\n### Action Items\\n- [ ] Review schema changes against current CQODE ETL\\n- [ ] Identify new tables/columns to add\\n- [ ] Update permissible value mappings\\n- [ ] Test updated ETL against sample data\\n- [ ] Update CQODE documentation\",\"assignee\":\"