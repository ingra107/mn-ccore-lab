                  - textbox [ref=e1146]:
                    - paragraph [ref=e1147]: "## CLIF v3.0.0 Changes Affecting CQODE (March 5, 2026) ### 1. NEW TABLE: `input` (replaces intake side of `intake_output`) **Columns:** hospitalization_id, recorded_dttm, input_name, input_category, input_group, input_volume (mL) **input_group values:** iv_fluids, blood_products, nutrition, medication_fluids, renal_replacement_fluids, flush_irrigation, other_intake **input_category values (16):** - iv_crystalloid, iv_colloid -> iv_fluids - blood_products -> blood_products - parenteral_nutrition, po_intake, enteral_nutrition, enteral_water -> nutrition - iv_medication, enteral_medication -> medication_fluids - renal_replacement_fluids -> renal_replacement_fluids - flush_irrigation_urine, flush_irrigation_drain, flush_irrigation_gi, flush_irrigation_respiratory, flush_irrigation_other -> flush_irrigation - other_input -> other_intake ### 2. NEW TABLE: `output` (replaces output side of `intake_output`) **Columns:** hospitalization_id, recorded_dttm, output_name, output_category, output_group, output_volume (mL) **output_group values:** urine, ultrafiltration, drains, gi, procedure, blood_loss, respiratory, other ### 3. REMOVED: `intake_output` table (split into input + output) ### 4. Other v3.0.0 changes - **labs:** new `loinc_version` column - **medication_admin_continuous:** new `infusion_rate` + `infusion_rate_units` columns - **respiratory_support:** new device_category value \"T Piece\" - **NEW TABLES (not in CQODE scope):** intermittent_dialysis, validated_diagnosis, clinical_notes_facts, clinical_notes_text ### Links - GitHub: https://github.com/Common-Longitudinal-ICU-data-Format/CLIF/issues/179 - Change log: https://clif-icu.com/data-dictionary/change-log - v3.0.0 data dictionary: https://clif-icu.com/data-dictionary/data-dictionary-3.0.0 - mCIDE (3.0 branch): https://github.com/Common-Longitudinal-ICU-data-Format/CLIF/tree/3.0/mCIDE/input ### CQODE Action Items - [ ] Create `input` table mapping from EHR flowsheet data - [ ] Create `output` table mapping from EHR flowsheet data - [ ] Remove or deprecate `intake_output` ETL - [ ] Add `loinc_version` to labs ETL - [ ] Add `infusion_rate` + `infusion_rate_units` to medication_admin_continuous ETL - [ ] Add \"T Piece\" to respiratory_support device_category mapping"
