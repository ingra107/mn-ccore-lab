# ═══ TOP LEVEL IS DELIBERATELY INERT (post-mortem 2026-07-06, backlog #500) ═══
# Prod capability is GRANTED, not inherited. Every binding and every cron lives
# under [env.production] ONLY. Consequences, by construction:
#   - bare `wrangler deploy`            → mints/updates "mn-ccore-lab-api-scratch":
#                                         no D1, no R2, no service binding, no crons.
#                                         Inert. (The wrapper blocks even this — see
#                                         scripts/wrangler_d1.py deploy guard.)
#   - `wrangler deploy --name anything` → copies THIS top level → equally inert.
#   - `wrangler deploy --env test`      → error (no [env.test] defined); envs do
#                                         NOT inherit bindings/triggers in wrangler.
# The June-7 `mn-ccore-lab-api-test` twin (prod bindings + crons via a copy of the
# old all-top-level config; raced the prod crons for a month and wiped the calendar
# cache — see Context/Decisions/2026-07-06-calendar-outage-orphaned-test-worker.md
# in Peripheral-Brain) is unrepresentable under this construction.
#
# PROD DEPLOY (the only form that touches the real worker):
#   python scripts/wrangler_d1.py deploy --env production
name = "mn-ccore-lab-api-scratch"
main = "api/index.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

[site]
bucket = "./dist"

# ─── PRODUCTION — the real worker. name pinned so deploys update it in place. ───
[env.production]
name = "mn-ccore-lab-api"
# No public workers.dev URL. This worker exists for its crons and bindings; the
# Hub's /api is served by the Pages Function (functions/api/[[route]].ts), which
# has REQUIRE_AUTH=1. The workers.dev URL ran without REQUIRE_AUTH, so it served
# every route, reads and writes, to anonymous callers (found 2026-10-08). Nothing
# calls it. Crons and the service binding do not need it.
workers_dev = false

# Workers Logs: keeps console.error from the cron runs only. Before this the
# ledger prune error lived only in console.error (July to 10-08) and was lost.
# The NotificationHub DO runs in hub-realtime (workers/hub-realtime/wrangler.toml),
# which this block does not cover. /api is served by the Pages Function, which has
# its own logging setting. Syntax: developers.cloudflare.com/workers/observability/logs/workers-logs
[env.production.observability]
enabled = true

[[env.production.d1_databases]]
binding = "DB"
database_name = "mnccore-lab"
database_id = "b8453e9b-7c5f-4029-b07d-dd89c05d00cf"

# DB_TEST is LIVE machinery, not legacy: the X-Test-Mode header swap
# (api/index.ts:218-231, guarded by TEST_MODE_KEY) routes test-mode requests
# to mnccore-lab-test. Do not drop without retiring that path (backlog #502a
# resolved KEEP, 2026-07-06).
[[env.production.d1_databases]]
binding = "DB_TEST"
database_name = "mnccore-lab-test"
database_id = "a30fe84d-0891-4035-9358-f7813b5f5807"

[env.production.triggers]
# Morning pulse email: weekdays at 7 AM CT (13:00 UTC)
#   Sent through Resend (api/lib/email.ts), same as the daily digest.
# Daily coordinator digest: every day at 6 AM CT (11:00 UTC during DST)
#   To activate: wrangler secret put RESEND_API_KEY --env production
# RESEND_API_KEY and DIGEST_RECIPIENTS must be set on BOTH this Worker and the
#   Pages project mn-ccore-lab (the task-assignment email sends from Pages).
# All three email kinds go to Nick only until DIGEST_RECIPIENTS is set
#   (api/lib/email.ts: comma list of addresses, or "all"). A list REPLACES the
#   default, so include both of Nick's addresses: ingra107@umn.edu and
#   nicholas.ingraham@gmail.com.
# iCal feed poller: hourly. ETag/If-Modified-Since makes most polls cheap
#   (~200 bytes 304 vs ~500KB full fetch).
crons = ["0 13 * * 1-5", "0 11 * * *", "0 * * * *"]

[[env.production.r2_buckets]]
binding = "FILES"
bucket_name = "mnccore-files"

# The hub-realtime Worker's NotificationHub Durable Object, bound directly (the
# Pages project binds the same namespace). api/lib/notify.ts calls its RPC
# methods (shared/realtime.ts); there is no HTTP broadcast path. Was a service
# binding + public-URL fallback until 2026-10-08.
[[env.production.durable_objects.bindings]]
name = "NOTIFICATION_HUB"
class_name = "NotificationHub"
script_name = "hub-realtime"
