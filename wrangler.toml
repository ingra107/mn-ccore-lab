name = "mn-ccore-lab-api"
main = "api/index.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

[[d1_databases]]
binding = "DB"
database_name = "mnccore-lab"
database_id = "b8453e9b-7c5f-4029-b07d-dd89c05d00cf"

[[d1_databases]]
binding = "DB_TEST"
database_name = "mnccore-lab-test"
database_id = "a30fe84d-0891-4035-9358-f7813b5f5807"

[triggers]
# Morning pulse email: weekdays at 7 AM CT (13:00 UTC)
# To activate: wrangler secret put SENDGRID_API_KEY
# Daily coordinator digest: every day at 6 AM CT (11:00 UTC during DST)
# To activate: wrangler secret put RESEND_API_KEY
# iCal feed poller: every 15 minutes (cron has 15min wall-clock budget —
# safe for slow Google Calendar exports that exceed the 30s on-demand limit)
crons = ["0 13 * * 1-5", "0 11 * * *", "*/15 * * * *"]

[[r2_buckets]]
binding = "FILES"
bucket_name = "mnccore-files"

# Service binding to the hub-realtime Worker for DO broadcast. Cross-Worker
# Durable Object access requires this — prior `env.NOTIFICATION_HUB` used as
# a DurableObjectNamespace silently returned undefined because no binding
# existed. Now `env.NOTIFICATION_HUB.fetch(...)` routes internally through
# the CF edge network (no public DNS/TLS hop) to the hub-realtime worker,
# which forwards to the DO's onRequest for broadcast.
[[services]]
binding = "NOTIFICATION_HUB"
service = "hub-realtime"

[site]
bucket = "./dist"
