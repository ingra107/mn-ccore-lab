name = "mn-ccore-lab-api"
main = "api/index.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

[[d1_databases]]
binding = "DB"
database_name = "mnccore-lab"
database_id = "b8453e9b-7c5f-4029-b07d-dd89c05d00cf"

[[d1_databases]]
binding = "DB_TEST"
database_name = "mnccore-lab-test"
database_id = "a30fe84d-0891-4035-9358-f7813b5f5807"

[triggers]
# Morning pulse email: weekdays at 7 AM CT (13:00 UTC)
# To activate: wrangler secret put SENDGRID_API_KEY
# Daily coordinator digest: every day at 6 AM CT (11:00 UTC during DST)
# To activate: wrangler secret put RESEND_API_KEY
crons = ["0 13 * * 1-5", "0 11 * * *"]

[[r2_buckets]]
binding = "FILES"
bucket_name = "mnccore-files"

[site]
bucket = "./dist"
