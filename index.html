<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <!-- PWA meta -->
    <meta name="theme-color" content="#0b1017" media="(prefers-color-scheme: dark)">
    <meta name="theme-color" content="#f5f5f5" media="(prefers-color-scheme: light)">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="manifest" href="/manifest.webmanifest">
    <!-- Synchronous density init: set data-density on <html> before first paint to prevent CLS -->
    <script>
      (function() {
        try {
          var d = localStorage.getItem('mn-ccore-density') || 'comfortable';
          document.documentElement.setAttribute('data-density', d);
        } catch (e) {
          document.documentElement.setAttribute('data-density', 'comfortable');
        }
      })();
    </script>
    <meta name="description" content="MN-CCORE: Minnesota Critical Care Outcomes & Research Effort at the University of Minnesota. Multi-center ICU research, CLIF Consortium, provider variation, and clinical decision-making." />

    <!-- Open Graph -->
    <meta property="og:title" content="MN-CCORE | Minnesota Critical Care Outcomes & Research Effort" />
    <meta property="og:description" content="Advancing critical care through data-driven discovery. Multi-center ICU research at the University of Minnesota." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://mn-ccore-lab.pages.dev" />
    <meta property="og:site_name" content="MN-CCORE Lab" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:image" content="https://mn-ccore-lab.pages.dev/og-image.svg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="MN-CCORE | Minnesota Critical Care Outcomes & Research Effort" />
    <meta name="twitter:description" content="Advancing critical care through data-driven discovery. Multi-center ICU research at the University of Minnesota." />
    <meta name="twitter:image" content="https://mn-ccore-lab.pages.dev/og-image.svg" />

    <!-- Additional SEO -->
    <meta name="author" content="MN-CCORE Lab, University of Minnesota" />
    <meta name="keywords" content="critical care, ICU, CLIF consortium, provider variation, lung-protective ventilation, clinical decision-making, University of Minnesota" />
    <link rel="canonical" href="https://mn-ccore-lab.pages.dev" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Critical: DM Sans (portal + all pages) — loads immediately -->
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&display=swap" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&display=swap" />

    <!-- Deferred: Fraunces (public pages only) — async, non-blocking -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,800&display=swap" media="print" onload="this.media='all'" />

    <!-- Lazy: JetBrains Mono (kbd elements only) — async, non-blocking -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap" media="print" onload="this.media='all'" />

    <!-- Noscript fallback for deferred fonts -->
    <noscript>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,800&family=JetBrains+Mono:wght@400;500&display=swap" />
    </noscript>
    <title>MN-CCORE | Minnesota Critical Care Outcomes &amp; Research Effort</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
