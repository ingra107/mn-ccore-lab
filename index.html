<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <!-- PWA meta -->
    <meta name="theme-color" content="#0b1017" media="(prefers-color-scheme: dark)">
    <meta name="theme-color" content="#f5f5f5" media="(prefers-color-scheme: light)">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="manifest" href="/manifest.webmanifest">
    <!-- P3-7: Synchronous density init. ONE global density (key: hub-table-density),
         compact by default. Sets the density-* class + data-density on <html> before
         first paint so --row-height is correct from render 1 (no CLS). -->
    <script>
      (function() {
        var d = 'compact';
        try {
          var stored = localStorage.getItem('hub-table-density');
          if (stored === 'compact' || stored === 'default' || stored === 'relaxed') d = stored;
        } catch (e) { /* default compact */ }
        var root = document.documentElement;
        root.setAttribute('data-density', d);
        if (d === 'compact') root.classList.add('density-compact');
        else if (d === 'relaxed') root.classList.add('density-relaxed');
      })();
    </script>
    <meta name="description" content="MN-CCORE: Minnesota Critical Care Outcomes & Research Effort at the University of Minnesota. Multi-center ICU research, CLIF Consortium, provider variation, and clinical decision-making." />

    <!-- Open Graph -->
    <meta property="og:title" content="MN-CCORE | Minnesota Critical Care Outcomes & Research Effort" />
    <meta property="og:description" content="Advancing critical care through data-driven discovery. Multi-center ICU research at the University of Minnesota." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://mn-ccore-lab.pages.dev" />

    <meta property="og:image" content="https://mn-ccore-lab.pages.dev/og-image.svg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <!-- Twitter Card -->

    <meta name="twitter:title" content="MN-CCORE | Minnesota Critical Care Outcomes & Research Effort" />
    <meta name="twitter:description" content="Advancing critical care through data-driven discovery. Multi-center ICU research at the University of Minnesota." />
    <meta name="twitter:image" content="https://mn-ccore-lab.pages.dev/og-image.svg" />

    <!-- Critical: DM Sans (portal + all pages) — loads immediately -->

    <!-- Deferred: Fraunces (public pages only) — async, non-blocking -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,800&display=swap" media="print" onload="this.media='all'" crossorigin="anonymous" />

    <!-- Lazy: JetBrains Mono (kbd elements only) — async, non-blocking -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap" media="print" onload="this.media='all'" crossorigin="anonymous" />

    <!-- Noscript fallback for deferred fonts -->
